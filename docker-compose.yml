services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: duality
      POSTGRES_PASSWORD: duality
      POSTGRES_DB: duality
    ports:
      - "5433:5432"
    volumes:
      - duality_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duality -d duality"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  duality_pg:
