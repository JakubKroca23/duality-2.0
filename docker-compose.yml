services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: duality
      POSTGRES_PASSWORD: duality
      POSTGRES_DB: duality
    ports:
      - "5433:5432"
    volumes:
      - duality_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duality -d duality"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://duality:duality@db:5432/duality
      PORT: "8787"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8787"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  duality_pg:
