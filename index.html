<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chaos 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Audiowide&family=JetBrains+Mono:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="flex flex-col items-center justify-start sm:justify-center p-2 sm:p-3 select-none min-h-screen">
    <div id="workspace" class="workspace flex flex-col items-center w-full max-w-full">
    <div id="simWrapper" class="sim-wrapper flex flex-col items-stretch my-auto">
      <div class="play-row">
        <div id="activeStage" class="arena-stage" data-session-stage>
          <div
            id="mainToolbar"
            class="main-toolbar w-full flex items-center justify-between gap-1.5 sm:gap-2 relative z-40"
          >
            <div class="flex items-center gap-1 sm:gap-1.5 shrink-0 toolbar-actions-left">
              <button
                id="btnPlayPause" data-action="play-pause" data-role="btn-play-pause"
                class="toolbar-btn"
                title="Pozastavit / Spustit"
              >
                <svg id="iconPause" data-role="icon-pause" class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <svg id="iconPlay" data-role="icon-play" class="w-4 h-4 hidden text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
              </button>

              <button
                id="btnReset" data-action="reset" data-role="btn-reset"
                class="toolbar-btn"
                title="Resetovat"
              >
                <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
              </button>

              <button
                id="btnSound" data-action="sound" data-role="btn-sound"
                class="toolbar-btn"
                title="Zvuk"
              >
                <svg id="iconSoundOn" data-role="icon-sound-on" class="w-3.5 h-3.5 sm:w-4 sm:h-4 hidden text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                </svg>
                <svg id="iconSoundOff" data-role="icon-sound-off" class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path>
                </svg>
              </button>
            </div>

            <div class="flex-1 min-w-0 max-w-[200px] sm:max-w-sm px-1 sm:px-2 flex flex-col justify-center gap-0.5 toolbar-scoreblock">
              <div class="flex justify-between items-center text-[11px] sm:text-xs font-semibold mono">
                <div class="flex items-center gap-1 sm:gap-1.5" id="labelLeft" data-role="label-left">
                  <span id="dotLeft" data-role="dot-left" class="w-1.5 h-1.5 shadow-[0_0_8px_currentColor]"></span>
                  <span id="scoreDay" data-role="score-day" class="font-extrabold tracking-tight text-[11px] sm:text-xs">200</span>
                  <span id="pctDay" data-role="pct-day" class="text-[9px] opacity-75 font-normal hidden sm:inline">(50%)</span>
                </div>
                <div class="flex items-center gap-1 sm:gap-1.5" id="labelRight" data-role="label-right">
                  <span id="pctNight" data-role="pct-night" class="text-[9px] opacity-75 font-normal hidden sm:inline">(50%)</span>
                  <span id="scoreNight" data-role="score-night" class="font-extrabold tracking-tight text-[11px] sm:text-xs">200</span>
                  <span id="dotRight" data-role="dot-right" class="w-1.5 h-1.5 shadow-[0_0_8px_currentColor]"></span>
                </div>
              </div>
              <div class="w-full h-1 bg-black/80 overflow-hidden flex border border-white/10 shadow-[inset_0_0_4px_rgba(0,0,0,0.8)]">
                <div id="barDay" data-role="bar-day" class="h-full transition-all duration-150" style="width: 50%"></div>
                <div id="barNight" data-role="bar-night" class="h-full transition-all duration-150" style="width: 50%"></div>
              </div>
              <div class="toolbar-stats flex items-center justify-between gap-2 mono text-[9px] sm:text-[10px] text-slate-400">
                <span id="statRunTime" data-role="stat-run-time" class="tabular-nums tracking-tight text-slate-300" title="Čas běhu">0:00</span>
                <div class="flex items-center gap-1.5 sm:gap-2 min-w-0">
                  <span id="statLeadDay" data-role="stat-lead-day" class="tabular-nums truncate" title="Podíl času s převahou A">▲ 0%</span>
                  <span id="statLeadNight" data-role="stat-lead-night" class="tabular-nums truncate" title="Podíl času s převahou B">▲ 0%</span>
                </div>
              </div>
            </div>

            <div class="flex items-center gap-0.5 sm:gap-1 shrink-0 toolbar-actions-right">
              <button
                id="btnToggleSettings" data-action="settings" data-role="btn-settings"
                class="toolbar-btn-ghost"
                title="Nastavení"
                aria-label="Nastavení"
                aria-expanded="false"
                aria-controls="drawerSettingsContent"
              >
                <svg class="text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
              </button>
              <button
                id="btnCloseArena"
                class="toolbar-btn-ghost"
                title="Zavřít arénu"
                aria-label="Zavřít arénu"
                data-action="close-arena"
                data-role="btn-close-arena"
              >
                <svg class="text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
              </button>
            </div>
          </div>

          <div id="arenaFrame" data-role="arena-frame" class="canvas-container relative">
            <canvas id="simCanvas" data-role="sim-canvas"></canvas>
            <div id="shaderScanlines" data-role="shader-scanlines" class="scanlines-overlay"></div>
            <div class="vignette-overlay"></div>
          </div>
        </div>

        <aside
          id="drawerSettingsContent"
          class="settings-panel"
          role="dialog"
          aria-label="Nastavení"
          aria-hidden="true"
        >
          <div class="settings-panel-inner">
            <div class="settings-modal-head">
              <div class="flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_8px_#00f0ff]"></span>
                <span class="font-extrabold text-xs sm:text-[13px] tracking-wider mono uppercase text-cyan-300">NASTAVENÍ</span>
              </div>
              <div class="flex items-center gap-1.5">
                <button type="button" id="btnResetAllDefaults" class="settings-modal-reset" title="Obnovit výchozí">
                  Obnovit
                </button>
                <button type="button" id="btnCloseSettings" class="settings-modal-close" title="Zavřít">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                  </svg>
                </button>
              </div>
            </div>

            <div class="settings-tabs" role="tablist" aria-label="Kategorie nastavení">
              <button type="button" class="settings-tab active" role="tab" aria-selected="true" data-settings-tab="physics" id="tabSettingsPhysics">
                Fyzika
              </button>
              <button type="button" class="settings-tab" role="tab" aria-selected="false" data-settings-tab="look" id="tabSettingsLook">
                Vzhled
              </button>
              <button type="button" class="settings-tab" role="tab" aria-selected="false" data-settings-tab="shaders" id="tabSettingsShaders">
                Shadery
              </button>
            </div>

            <div class="settings-overlay-scroll">
              <div class="settings-tab-panel active" data-settings-panel="physics" role="tabpanel" aria-labelledby="tabSettingsPhysics">
                <div class="settings-list">
                  <div class="settings-row">
                    <div class="settings-row-meta">
                      <span>Rychlost</span>
                      <span id="lblSpeedVal" class="settings-val">6.0 m/s</span>
                    </div>
                    <input id="sliderSpeedPhysics" type="range" min="0" max="1000" step="1" value="479" class="settings-range accent-emerald-400" />
                  </div>
                  <div class="settings-row">
                    <div class="settings-row-meta">
                      <span>Počet bodů</span>
                      <span id="lblBallsVal" class="settings-val">1 na tým</span>
                    </div>
                    <input id="sliderBallsCount" type="range" min="1" max="9" step="1" value="1" class="settings-range accent-emerald-400" />
                  </div>
                  <div class="settings-row">
                    <div class="settings-row-meta">
                      <span>Mřížka</span>
                      <span id="lblGridSizeVal" class="settings-val">20×20</span>
                    </div>
                    <input id="sliderGridSize" type="range" min="3" max="512" step="1" value="20" class="settings-range accent-emerald-400" />
                  </div>
                </div>
              </div>

              <div class="settings-tab-panel" data-settings-panel="look" role="tabpanel" aria-labelledby="tabSettingsLook">
                <div class="settings-list">
                  <div class="settings-row settings-row-theme relative" id="themeSelectorContainer">
                    <div class="settings-row-meta">
                      <span>Téma</span>
                    </div>
                    <button id="btnCurrentThemeTrigger" class="settings-theme-btn" type="button">
                      <div class="flex items-center gap-1.5 truncate min-w-0">
                        <div class="flex items-center -space-x-1 shrink-0">
                          <span id="themeBtnDotDay" class="w-2.5 h-2.5 rounded-full"></span>
                          <span id="themeBtnDotNight" class="w-2.5 h-2.5 rounded-full"></span>
                        </div>
                        <span id="themeBtnName" class="font-bold text-slate-100 tracking-wider truncate">NIGHT CITY</span>
                      </div>
                      <svg id="themePickerChevron" class="w-3 h-3 text-cyan-400 shrink-0 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                      </svg>
                    </button>
                    <div id="themeDropdownMenu" class="hidden theme-dropdown-panel">
                      <div id="themeListContainer" class="space-y-0.5"></div>
                      <div class="theme-save-row">
                        <input
                          id="inputThemeName"
                          type="text"
                          maxlength="32"
                          placeholder="Název nového tématu"
                          class="theme-save-input"
                          autocomplete="off"
                          spellcheck="false"
                        />
                        <button id="btnSaveTheme" type="button" class="theme-save-btn" title="Uložit aktuální vzhled jako téma">
                          Uložit
                        </button>
                      </div>
                    </div>
                  </div>

                  <div class="settings-row">
                    <div class="settings-row-meta">
                      <span>Barvy</span>
                      <span class="settings-hint">A / B</span>
                    </div>
                    <div class="settings-colors">
                      <input id="colorDay" type="color" value="#00f0ff" class="color-swatch-input" title="Strana A" />
                      <input id="colorNight" type="color" value="#ff0055" class="color-swatch-input" title="Strana B" />
                    </div>
                  </div>

                  <div class="settings-row">
                    <div class="settings-row-meta">
                      <span>Stopa</span>
                      <div class="settings-inline">
                        <label class="settings-check">
                          <input type="checkbox" id="chkTrailSolid" checked class="accent-cyan-400" />
                          <span>Vcelku</span>
                        </label>
                        <span id="lblTrailVal" class="settings-val">6</span>
                      </div>
                    </div>
                    <input id="sliderTrail" type="range" min="0" max="30" step="2" value="6" class="settings-range accent-cyan-400" />
                  </div>

                  <div class="settings-row">
                    <div class="settings-row-meta">
                      <span>Částice</span>
                      <span id="lblParticlesVal" class="settings-val">3</span>
                    </div>
                    <input id="sliderParticles" type="range" min="0" max="40" step="1" value="3" class="settings-range accent-cyan-400" />
                  </div>

                  <div class="settings-row">
                    <div class="settings-row-meta">
                      <span>Sytost oblasti</span>
                      <span id="lblAreaSatVal" class="settings-val">42%</span>
                    </div>
                    <input id="sliderAreaSat" type="range" min="0" max="100" step="1" value="42" class="settings-range accent-cyan-400" />
                  </div>

                  <div class="settings-row">
                    <div class="settings-row-meta">
                      <span>Dělící linka</span>
                      <div class="settings-inline">
                        <input id="colorFrontier" type="color" value="#c8d4dc" class="color-swatch-input settings-swatch-sm" title="Barva hranice" />
                        <span id="lblFrontierVal" class="settings-val">22%</span>
                      </div>
                    </div>
                    <input id="sliderFrontier" type="range" min="0" max="100" step="5" value="22" class="settings-range accent-cyan-400" />
                  </div>

                  <div class="settings-row">
                    <div class="settings-row-meta">
                      <span>Velikost bodu</span>
                      <span id="lblBallScaleVal" class="settings-val">100%</span>
                    </div>
                    <input id="sliderBallScale" type="range" min="50" max="200" step="5" value="100" class="settings-range accent-cyan-400" />
                  </div>

                  <div class="settings-row settings-row-toggles">
                    <label class="settings-check settings-check-row">
                      <span>CRT filtr</span>
                      <input type="checkbox" id="chkScanlines" class="accent-cyan-400" />
                    </label>
                    <div class="settings-row-meta">
                      <span>Mřížka</span>
                      <input id="sliderGrid" type="range" min="0" max="35" step="5" value="8" class="settings-range settings-range-inline accent-cyan-400" />
                    </div>
                  </div>
                </div>
              </div>

              <div class="settings-tab-panel" data-settings-panel="shaders" role="tabpanel" aria-labelledby="tabSettingsShaders">
                <div class="settings-list">
                  <div class="settings-row" id="rowLightShader">
                    <div class="settings-row-meta">
                      <label class="settings-check settings-shader-enable">
                        <input type="checkbox" id="chkLightShaderOn" checked class="accent-fuchsia-400" />
                        <span>Světelný shader</span>
                      </label>
                      <span id="lblLightVal" class="settings-val">22</span>
                    </div>
                    <input id="sliderLight" type="range" min="0" max="100" step="5" value="22" class="settings-range accent-fuchsia-400" />
                    <div class="settings-row-meta settings-row-meta-sub">
                      <span>Dosah</span>
                      <span id="lblLightReachVal" class="settings-val">32%</span>
                    </div>
                    <input id="sliderLightReach" type="range" min="0" max="100" step="5" value="32" class="settings-range accent-fuchsia-400" />
                    <div class="settings-shader-opts">
                      <label class="settings-check">
                        <input type="checkbox" id="chkLightShaderGrid" class="accent-fuchsia-400" />
                        <span>Mřížka</span>
                      </label>
                      <label class="settings-fade">
                        <span>Zmizení</span>
                        <input id="inputLightFadeMs" type="number" min="50" max="2000" step="50" value="220" class="settings-ms" />
                        <span>ms</span>
                      </label>
                      <div class="settings-shader-colors">
                        <div class="settings-shader-color">
                          <button type="button" class="settings-shader-side-reset" id="btnLightColorA" title="Použít barvu bodu A">
                            <span class="settings-side-dot" id="dotLightA"></span>
                            <span>A</span>
                          </button>
                          <input id="colorLightA" type="color" value="#00d4e8" class="color-swatch-input settings-swatch-sm" title="Vlastní barva A" />
                        </div>
                        <div class="settings-shader-color">
                          <button type="button" class="settings-shader-side-reset" id="btnLightColorB" title="Použít barvu bodu B">
                            <span class="settings-side-dot" id="dotLightB"></span>
                            <span>B</span>
                          </button>
                          <input id="colorLightB" type="color" value="#e8366a" class="color-swatch-input settings-swatch-sm" title="Vlastní barva B" />
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="settings-row" id="rowCollisionShader">
                    <div class="settings-row-meta">
                      <label class="settings-check settings-shader-enable">
                        <input type="checkbox" id="chkCollisionShaderOn" checked class="accent-fuchsia-400" />
                        <span>Kolizní shader</span>
                      </label>
                      <span id="lblCollisionVal" class="settings-val">18</span>
                    </div>
                    <input id="sliderCollision" type="range" min="0" max="100" step="5" value="18" class="settings-range accent-fuchsia-400" />
                    <div class="settings-row-meta settings-row-meta-sub">
                      <span>Dosah</span>
                      <span id="lblCollisionReachVal" class="settings-val">28%</span>
                    </div>
                    <input id="sliderCollisionReach" type="range" min="0" max="100" step="5" value="28" class="settings-range accent-fuchsia-400" />
                    <div class="settings-shader-opts">
                      <label class="settings-check">
                        <input type="checkbox" id="chkCollisionShaderGrid" class="accent-fuchsia-400" />
                        <span>Mřížka</span>
                      </label>
                      <label class="settings-fade">
                        <span>Zmizení</span>
                        <input id="inputCollisionFadeMs" type="number" min="50" max="2000" step="50" value="180" class="settings-ms" />
                        <span>ms</span>
                      </label>
                      <div class="settings-shader-colors">
                        <div class="settings-shader-color">
                          <button type="button" class="settings-shader-side-reset" id="btnCollisionColorA" title="Použít barvu bodu A">
                            <span class="settings-side-dot" id="dotCollisionA"></span>
                            <span>A</span>
                          </button>
                          <input id="colorCollisionA" type="color" value="#ffffff" class="color-swatch-input settings-swatch-sm" title="Vlastní barva A" />
                        </div>
                        <div class="settings-shader-color">
                          <button type="button" class="settings-shader-side-reset" id="btnCollisionColorB" title="Použít barvu bodu B">
                            <span class="settings-side-dot" id="dotCollisionB"></span>
                            <span>B</span>
                          </button>
                          <input id="colorCollisionB" type="color" value="#ffffff" class="color-swatch-input settings-swatch-sm" title="Vlastní barva B" />
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="settings-row" id="rowReflectionShader">
                    <div class="settings-row-meta">
                      <label class="settings-check settings-shader-enable">
                        <input type="checkbox" id="chkReflectionShaderOn" class="accent-fuchsia-400" />
                        <span>Odrazový shader</span>
                      </label>
                      <span id="lblReflectionVal" class="settings-val">40</span>
                    </div>
                    <input id="sliderReflection" type="range" min="0" max="100" step="5" value="40" class="settings-range accent-fuchsia-400" />
                    <div class="settings-row-meta settings-row-meta-sub">
                      <span>Dosah</span>
                      <span id="lblReflectionReachVal" class="settings-val">40%</span>
                    </div>
                    <input id="sliderReflectionReach" type="range" min="0" max="100" step="5" value="40" class="settings-range accent-fuchsia-400" />
                    <div class="settings-shader-opts">
                      <label class="settings-check">
                        <input type="checkbox" id="chkReflectionShaderGrid" class="accent-fuchsia-400" />
                        <span>Mřížka</span>
                      </label>
                      <label class="settings-fade">
                        <span>Zmizení</span>
                        <input id="inputReflectionFadeMs" type="number" min="50" max="2000" step="50" value="300" class="settings-ms" />
                        <span>ms</span>
                      </label>
                      <div class="settings-shader-colors">
                        <div class="settings-shader-color">
                          <button type="button" class="settings-shader-side-reset" id="btnReflectionColorA" title="Použít barvu bodu A">
                            <span class="settings-side-dot" id="dotReflectionA"></span>
                            <span>A</span>
                          </button>
                          <input id="colorReflectionA" type="color" value="#8ad4e8" class="color-swatch-input settings-swatch-sm" title="Vlastní barva A" />
                        </div>
                        <div class="settings-shader-color">
                          <button type="button" class="settings-shader-side-reset" id="btnReflectionColorB" title="Použít barvu bodu B">
                            <span class="settings-side-dot" id="dotReflectionB"></span>
                            <span>B</span>
                          </button>
